<section class="section" id="quickstart" aria-labelledby="quickstart-heading">
  <div class="w-container w-container--lg">
    <div class="section-head">
      <span class="eyebrow">From your stack</span>
      <h2 id="quickstart-heading">{heading}</h2>
      <p>
        Any language can call the Yon host's HTTP API with a SESAME session. A Go application
        can instead start the engine itself through the standard-library-only Go package —
        and with <code>SESAME_DEPLOYMENT</code> set, no path in your code either.
      </p>
    </div>

    <div class="qs-panel">
      <div class="qs-tabs" role="tablist" aria-label="Surface">
        <loop :for="let language of languages">
          <button
            type="button"
            role="tab"
            :class="'w-btn w-btn--sm ' + (language === active ? 'w-btn-filled' : 'w-btn-text')"
            :aria-selected="language === active"
            on:click="select(language)"
          >{language}</button>
        </loop>
      </div>

      <pre class="code-block"><code>{snippet}</code></pre>
    </div>
  </div>
</section>
