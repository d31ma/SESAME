name: Site Deploy

# Deploys the website zip that Release attached to a GitHub release to Amplify
# production, once kestrel's Floci staging check has passed for that same zip.
# See docs/RELEASE_ENGINEERING.md ("Website").

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Released version whose site zip to deploy (YY.WW.DD or YY.WW.DD-N)
        required: true
        type: string
      target:
        description: after-staging waits for kestrel's Floci staging check; production deploys at once (rollback)
        required: true
        type: choice
        default: after-staging
        options: [after-staging, production]

permissions: {}

concurrency:
  group: site-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  CONFIG: .github/site-deploy.json
  SITE_ASSET_PREFIX: sesame-site

jobs:
  resolve:
    name: Find the released site zip
    # Only a Release run started by a pushed v* tag deploys by itself. A
    # Release re-run by workflow_dispatch is deployed with a manual run here.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
      commit: ${{ steps.release.outputs.commit }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - name: Checkout deploy tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Find the release and its site zip
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            TARGET="$INPUT_TARGET"
          else
            VERSION=$(git show "$HEAD_SHA:VERSION" | tr -d '[:space:]')
            TARGET=after-staging
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "::error::Version $VERSION is not YY.WW.DD CalVer."
            exit 1
          fi
          TAG="v$VERSION"
          TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)
          if [[ "$EVENT" == "workflow_run" && "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "::notice::$HEAD_SHA is not the release $TAG ($TAG_SHA); nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$TAG_SHA" ]]; then
            echo "::error::Release tag $TAG does not exist."
            exit 1
          fi
          ZIP="$SITE_ASSET_PREFIX-$VERSION.zip"
          mkdir -p site
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir site --pattern "$ZIP" --pattern "$ZIP.sha256"
          SHA256=$(cut -d' ' -f1 "site/$ZIP.sha256")
          bun scripts/site-deploy.mjs verify "site/$ZIP" "$SHA256"
          {
            echo "deploy=true"
            echo "version=$VERSION"
            echo "sha256=$SHA256"
            echo "commit=$TAG_SHA"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $ZIP ($SHA256) from $TAG_SHA, target $TARGET"

      - name: Keep the zip for the deploy job
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error

  deploy-production:
    name: Deploy production
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: site-production
      url: https://sesame.del.ma
    permissions:
      contents: read
      id-token: write
      statuses: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA256: ${{ needs.resolve.outputs.sha256 }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - name: Checkout deploy tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Download the site zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site

      - name: Verify the zip is the released one
        run: bun scripts/site-deploy.mjs verify "site/$SITE_ASSET_PREFIX-$VERSION.zip" "$SHA256"

      - name: Wait for the same zip to pass staging on Floci
        if: needs.resolve.outputs.target == 'after-staging'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/site-deploy.mjs wait-staging "$GITHUB_REPOSITORY" "$COMMIT" "$VERSION" "$SHA256"

      - name: Read the deploy role and region
        id: aws
        run: |
          set -euo pipefail
          echo "role=$(jq -r .role "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r .region "$CONFIG")" >> "$GITHUB_OUTPUT"

      - name: Assume the production deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.aws.outputs.role }}
          aws-region: ${{ steps.aws.outputs.region }}

      - name: Check the PaaS header policy
        run: bun scripts/site-deploy.mjs check-headers "$CONFIG"

      - name: Record the version production serves now
        id: previous
        run: |
          set -euo pipefail
          PREVIOUS=$(bun scripts/site-deploy.mjs live-version "$CONFIG")
          echo "version=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Production serves '${PREVIOUS:-unknown}' before this deploy"

      - name: Deploy to Amplify production
        id: deploy
        run: bun scripts/site-deploy.mjs deploy "$CONFIG" "site/$SITE_ASSET_PREFIX-$VERSION.zip"

      - name: Probe production
        id: probe
        run: bun scripts/site-deploy.mjs probe "$CONFIG" "$VERSION"

      - name: Roll back to the previous version
        if: >-
          ${{
            failure() &&
            steps.probe.outcome == 'failure' &&
            steps.previous.outputs.version != '' &&
            steps.previous.outputs.version != env.VERSION
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="$SITE_ASSET_PREFIX-$PREVIOUS.zip"
          mkdir -p previous
          gh release download "v$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous --pattern "$ZIP" --pattern "$ZIP.sha256"
          bun scripts/site-deploy.mjs verify "previous/$ZIP" "$(cut -d' ' -f1 "previous/$ZIP.sha256")"
          bun scripts/site-deploy.mjs deploy "$CONFIG" "previous/$ZIP"
          bun scripts/site-deploy.mjs probe "$CONFIG" "$PREVIOUS"
          echo "::error::Production probes failed for $VERSION; production is back on $PREVIOUS."
