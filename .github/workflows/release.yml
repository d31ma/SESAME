name: Release

# Builds cross-compiled SESAME artifacts with checksums, an SPDX SBOM, and
# signed GitHub build attestations. Cross-compilation proves buildability
# only; native promotion gates are documented in
# docs/RELEASE_ENGINEERING.md and remain separate evidence.
#
# It also builds the website once and attaches sesame-site-<version>.zip and
# its .sha256 to the release, attested by this workflow. Site Deploy
# (site-deploy.yml) deploys that zip after kestrel's Floci staging check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v* tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  site:
    name: Build the website zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Test the site deploy script
        run: bun test scripts/site-deploy.test.mjs

      - name: Build the website
        working-directory: website
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run bundle

      - name: Package the site zip
        # site-version.json ({"version", "commit"}) goes at the zip's root,
        # and the zip is built byte-for-byte reproducibly, so the SHA-256
        # that staging and production check names exactly this build.
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          zip_name="sesame-site-${version}.zip"
          mkdir -p "$RUNNER_TEMP/site"
          sha256="$(bun scripts/site-deploy.mjs package website/dist/web "$version" "$commit" "$RUNNER_TEMP/site/${zip_name}")"
          echo "${sha256}  ${zip_name}" > "$RUNNER_TEMP/site/${zip_name}.sha256"
          echo "${zip_name} ${sha256}"

      - name: Keep the site zip for the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sesame-site
          path: ${{ runner.temp }}/site/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build, attest, and publish
    needs: site
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check VERSION against the tag
        # VERSION is what every SDK manifest is held to. If it disagrees with
        # the tag, the release would publish clients stamped with a version
        # the engine never shipped.
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag is not a SESAME CalVer tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_out" ]]; then
            echo "tag ${RELEASE_TAG} resolves to ${tag_commit}, checked out ${checked_out}" >&2
            exit 1
          fi
          declared="$(tr -d '[:space:]' < VERSION)"
          tagged="${RELEASE_TAG#v}"
          if [[ "$declared" != "$tagged" ]]; then
            echo "VERSION says ${declared}, tag says ${tagged}" >&2
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-X github.com/d31ma/sesame/internal/platform/buildinfo.version=${version} \
            -X github.com/d31ma/sesame/internal/platform/buildinfo.commit=${commit} \
            -X github.com/d31ma/sesame/internal/platform/buildinfo.builtAt=${built_at}"
          mkdir -p release-assets
          while read -r goos goarch suffix; do
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "release-assets/sesame-${goos}-${goarch}${suffix}" ./cmd/sesame
          done <<'TARGETS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64 .exe
          TARGETS

      - name: Package language clients
        # One file per language, paired with this release's binary and machine
        # protocol. There is no registry and no per-ecosystem manifest; the
        # tarball is the distribution. See docs/SDK_DISTRIBUTION.md.
        run: |
          set -euo pipefail
          tools/package-clients.sh release-assets/sesame-clients.tar.gz
          # The compile-and-run proof for every shim is a CI job; here we only
          # confirm the archive actually contains what a user will look for,
          # since a release that ships a tarball missing someone's language is
          # not recoverable after the fact.
          contents="$(tar -tzf release-assets/sesame-clients.tar.gz)"
          while read -r shim; do
            grep -Fqx "clients/${shim}" <<<"$contents" || {
              echo "sesame-clients.tar.gz is missing ${shim}" >&2; exit 1; }
          done <<'SHIMS'
          LICENSE
          node/sesame.mjs
          python/sesame.py
          rust/sesame.rs
          java/Sesame.java
          kotlin/Sesame.kt
          csharp/Sesame.cs
          php/sesame.php
          ruby/sesame.rb
          dart/sesame.dart
          SHIMS
          (cd release-assets && shasum -a 256 sesame-* > SHA256SUMS)

      - name: Download the site zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sesame-site
          # Outside the checkout, so the SBOM of the source stays unchanged.
          path: ${{ runner.temp }}/site-assets

      - name: Check the site zip
        # The zip must name this tag's version and commit, and its .sha256
        # must match it, before it is attested and published.
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          zip_name="sesame-site-${version}.zip"
          (cd "$RUNNER_TEMP/site-assets" && sha256sum --check --strict "${zip_name}.sha256")
          unzip -p "$RUNNER_TEMP/site-assets/${zip_name}" site-version.json |
            jq -e --arg version "$version" --arg commit "$(git rev-parse HEAD)" \
              '.version == $version and .commit == $commit' >/dev/null

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/sesame-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Prepare SLSA provenance predicate
        shell: bash
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          WORKFLOW_GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          builder_id="https://github.com/${WORKFLOW_IDENTITY}"
          invocation_id="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg tag_ref "refs/tags/${RELEASE_TAG}" \
            --arg source_commit "$source_commit" \
            --arg workflow_ref "$WORKFLOW_GIT_REF" \
            --arg workflow_commit "$GITHUB_SHA" \
            --arg builder_id "$builder_id" \
            --arg invocation_id "$invocation_id" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg repository_id "$REPOSITORY_ID" \
            --arg repository_owner_id "$REPOSITORY_OWNER_ID" \
            --arg runner_environment "$RUNNER_ENVIRONMENT" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {
                    ref: $workflow_ref,
                    repository: $repository,
                    path: ".github/workflows/release.yml"
                  }
                },
                internalParameters: {
                  github: {
                    event_name: $event_name,
                    repository_id: $repository_id,
                    repository_owner_id: $repository_owner_id,
                    runner_environment: $runner_environment
                  }
                },
                resolvedDependencies: [
                  {
                    uri: ("git+" + $repository + "@" + $workflow_ref),
                    digest: {
                      gitCommit: $workflow_commit
                    }
                  },
                  {
                    uri: ("git+" + $repository + "@" + $tag_ref),
                    digest: {
                      gitCommit: $source_commit
                    }
                  }
                ]
              },
              runDetails: {
                builder: {
                  id: $builder_id
                },
                metadata: {
                  invocationId: $invocation_id
                }
              }
            }' > "$RUNNER_TEMP/sesame-provenance.json"
          jq -e \
            --arg source_commit "$source_commit" \
            --arg workflow_commit "$GITHUB_SHA" \
            '.buildDefinition.buildType == "https://actions.github.io/buildtypes/workflow/v1"
             and .buildDefinition.resolvedDependencies[0].digest.gitCommit == $workflow_commit
             and .buildDefinition.resolvedDependencies[1].digest.gitCommit == $source_commit
             and (.buildDefinition.internalParameters.github.repository_id | length > 0)
             and (.buildDefinition.internalParameters.github.repository_owner_id | length > 0)
             and (.buildDefinition.internalParameters.github.runner_environment | length > 0)
             and (.runDetails.builder.id | length > 0)' \
            "$RUNNER_TEMP/sesame-provenance.json" >/dev/null

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release-assets/sesame-*
            ${{ runner.temp }}/site-assets/sesame-site-*.zip
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/sesame-provenance.json

      - name: Verify generated attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in release-assets/sesame-*; do
            case "$asset" in
              *.spdx.json|*SHA256SUMS) continue ;;
            esac
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
          gh attestation verify "$RUNNER_TEMP/site-assets/sesame-site-${RELEASE_TAG#v}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse HEAD)"
          remote_commit="$(
            git ls-remote --tags origin \
              "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" |
              awk '
                $2 ~ /\^\{\}$/ { peeled = $1 }
                $2 !~ /\^\{\}$/ { direct = $1 }
                END { print (peeled != "" ? peeled : direct) }
              '
          )"
          if [[ "$remote_commit" != "$expected_commit" ]]; then
            echo "remote tag ${RELEASE_TAG} resolves to ${remote_commit:-missing}, expected ${expected_commit}" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            release-assets/sesame-* release-assets/SHA256SUMS \
            "$RUNNER_TEMP"/site-assets/sesame-site-*
