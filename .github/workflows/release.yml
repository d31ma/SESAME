name: Release

# Builds cross-compiled SESAME artifacts with checksums, an SPDX SBOM, and
# signed GitHub build attestations. Cross-compilation proves buildability
# only; native promotion gates are documented in
# docs/RELEASE_ENGINEERING.md and remain separate evidence.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v* tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check VERSION against the tag
        # VERSION is what every SDK manifest is held to. If it disagrees with
        # the tag, the release would publish clients stamped with a version
        # the engine never shipped.
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag is not a SESAME CalVer tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_out" ]]; then
            echo "tag ${RELEASE_TAG} resolves to ${tag_commit}, checked out ${checked_out}" >&2
            exit 1
          fi
          declared="$(tr -d '[:space:]' < VERSION)"
          tagged="${RELEASE_TAG#v}"
          if [[ "$declared" != "$tagged" ]]; then
            echo "VERSION says ${declared}, tag says ${tagged}" >&2
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-X github.com/d31ma/sesame/internal/platform/buildinfo.version=${version} \
            -X github.com/d31ma/sesame/internal/platform/buildinfo.commit=${commit} \
            -X github.com/d31ma/sesame/internal/platform/buildinfo.builtAt=${built_at}"
          mkdir -p release-assets
          while read -r goos goarch suffix; do
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "release-assets/sesame-${goos}-${goarch}${suffix}" ./cmd/sesame
          done <<'TARGETS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64 .exe
          TARGETS

      - name: Package language clients
        # One file per language, paired with this release's binary and machine
        # protocol. There is no registry and no per-ecosystem manifest; the
        # tarball is the distribution. See docs/SDK_DISTRIBUTION.md.
        run: |
          set -euo pipefail
          tools/package-clients.sh release-assets/sesame-clients.tar.gz
          # The compile-and-run proof for every shim is a CI job; here we only
          # confirm the archive actually contains what a user will look for,
          # since a release that ships a tarball missing someone's language is
          # not recoverable after the fact.
          contents="$(tar -tzf release-assets/sesame-clients.tar.gz)"
          while read -r shim; do
            grep -Fqx "clients/${shim}" <<<"$contents" || {
              echo "sesame-clients.tar.gz is missing ${shim}" >&2; exit 1; }
          done <<'SHIMS'
          LICENSE
          node/sesame.mjs
          python/sesame.py
          rust/sesame.rs
          java/Sesame.java
          kotlin/Sesame.kt
          csharp/Sesame.cs
          php/sesame.php
          ruby/sesame.rb
          dart/sesame.dart
          SHIMS
          (cd release-assets && shasum -a 256 sesame-* > SHA256SUMS)

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/sesame-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Prepare SLSA provenance predicate
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          builder_id="https://github.com/${WORKFLOW_REF}"
          invocation_id="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg tag "$RELEASE_TAG" \
            --arg tag_ref "refs/tags/${RELEASE_TAG}" \
            --arg source_commit "$source_commit" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg workflow_commit "$GITHUB_SHA" \
            --arg builder_id "$builder_id" \
            --arg invocation_id "$invocation_id" \
            '{
              buildDefinition: {
                buildType: "https://github.com/d31ma/SESAME/blob/main/docs/RELEASE_ENGINEERING.md#automated-release-workflow",
                externalParameters: {
                  releaseTag: $tag
                },
                internalParameters: {
                  workflowRef: $workflow_ref,
                  workflowCommit: $workflow_commit
                },
                resolvedDependencies: [{
                  uri: ("git+" + $repository + "@" + $tag_ref),
                  digest: {
                    gitCommit: $source_commit
                  }
                }]
              },
              runDetails: {
                builder: {
                  id: $builder_id
                },
                metadata: {
                  invocationId: $invocation_id
                }
              }
            }' > "$RUNNER_TEMP/sesame-provenance.json"
          jq -e \
            --arg source_commit "$source_commit" \
            '.buildDefinition.resolvedDependencies[0].digest.gitCommit == $source_commit
             and (.buildDefinition.externalParameters.releaseTag | startswith("v"))
             and (.runDetails.builder.id | length > 0)' \
            "$RUNNER_TEMP/sesame-provenance.json" >/dev/null

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/sesame-*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/sesame-provenance.json

      - name: Verify generated attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in release-assets/sesame-*; do
            case "$asset" in
              *.spdx.json|*SHA256SUMS) continue ;;
            esac
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse HEAD)"
          remote_commit="$(
            git ls-remote --tags origin \
              "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" |
              awk '
                $2 ~ /\^\{\}$/ { peeled = $1 }
                $2 !~ /\^\{\}$/ { direct = $1 }
                END { print (peeled != "" ? peeled : direct) }
              '
          )"
          if [[ "$remote_commit" != "$expected_commit" ]]; then
            echo "remote tag ${RELEASE_TAG} resolves to ${remote_commit:-missing}, expected ${expected_commit}" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --target "$expected_commit" \
            --verify-tag \
            --generate-notes \
            release-assets/sesame-* release-assets/SHA256SUMS
