name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run vet
        run: go vet ./...

      # Named separately so a security regression is reported as one, rather
      # than as "some test failed" among hundreds.
      - name: Run the protocol adversarial suite
        run: go test -count=1 -v ./test/adversarial

      # A ratchet, not an aspiration: each package group carries its own floor,
      # set just below where it stands, so a drop fails the build while a
      # single module-wide number would have been meaningless.
      - name: Check coverage floors
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -count=1 -covermode=set -coverprofile=coverage.out ./internal/...
          go run ./tools/coverage -profile coverage.out

      - name: Upload the coverage profile
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14

  go-package:
    name: Go package contract corpus
    # The Go package in app/server/packages is the Yon host's engine transport and
    # the public package for Go hosts. Its scenario runs against a real
    # compiled engine, so a protocol divergence fails here rather than in a mock.
    # The Yon host's own tests (ty bundle, ty test --coverage) run in the local
    # release gate until a released ty can be installed here; see docs/YON.md.
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run the Go package tests
        working-directory: app/server/packages
        run: go test -count=1 ./...

  quality:
    name: Formatting, race, static analysis, and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        # Yon handler files under app/server/ have no package clause, so gofmt
        # cannot parse them; ty checks those. A parse error elsewhere fails.
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal test tools examples app/server/packages 2>&1)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: Run race detector
        run: go test -race -count=1 ./...

      - name: Run staticcheck
        shell: bash
        run: |
          GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Run govulncheck
        shell: bash
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  cross-build:
    name: Cross-compile only (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-compile SESAME
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "sesame-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/sesame
